name: Validar e publicar imagem de uploads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/publicar-imagem.yml'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe do Python
        run: python -m py_compile admin/app.py
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/Dockerfile
          push: true
          tags: |
            ghcr.io/pcfmachado-stack/mestre-moedeiro-uploads:0.2.0-beta
            ghcr.io/pcfmachado-stack/mestre-moedeiro-uploads:sha-${{ github.sha }}
