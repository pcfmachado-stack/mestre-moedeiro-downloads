version: '3.8'
# Estatísticas de visitas (Umami, D54) — stack "estatisticas" no Portainer.
# COLE ESTE ARQUIVO SEM ALTERAR NADA. Os ${...} abaixo são NOMES de variáveis, não lugar para a senha.
# Antes do Deploy, abaixo do editor, em "Environment variables" › "Add an environment variable", CRIE as duas:
#   name UMAMI_DB_SENHA    value: senha do banco (só letras e números, ~24)
#   name UMAMI_APP_SECRET  value: texto aleatório (só letras e números, ~64)
# Sem elas o banco falha com "superuser password is not specified" (E33).
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_SENHA}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      TRACKER_SCRIPT_NAME: mm.js          # nome neutro: bloqueadores costumam barrar "script.js" do Umami
      DISABLE_TELEMETRY: 1
    networks:
      - network_public
      - umami_interno
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.estatisticas.rule=Host(`estatisticas.mundonumista.com.br`)
        - traefik.http.routers.estatisticas.entrypoints=websecure
        - traefik.http.routers.estatisticas.tls=true
        - traefik.http.routers.estatisticas.tls.certresolver=letsencryptresolver
        - traefik.http.routers.estatisticas.service=estatisticas
        - traefik.http.services.estatisticas.loadbalancer.server.port=3000

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_SENHA}
    volumes:
      - umami_db:/var/lib/postgresql/data
    networks:
      - umami_interno
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  network_public:
    external: true
    name: network_public
  umami_interno:
    driver: overlay

volumes:
  umami_db:
