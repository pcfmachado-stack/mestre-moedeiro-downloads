server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    location / { try_files $uri $uri/ =404; }

    location = /versao.json {
        alias /data/site/versao.json;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Arquivos publicos da Central de Comunicacao.
    location /comunicacao/ {
        alias /data/site/comunicacao/;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Termos de Uso publicados pelo painel administrativo.
    location /termos/ {
        alias /data/site/termos/;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location /arquivos/ {
        alias /data/site/arquivos/;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
