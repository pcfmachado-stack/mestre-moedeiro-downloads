# Página inicial por domínio. D52 (05/11/2026): Desktop descontinuado — a página do programa para
# Windows saiu; downloads.mundonumista.com.br redireciona para a home do projeto.
map $host $pagina_inicial {
    default                    /inicio.html;
    mestremoedeiro.com.br      /inicio.html;
    www.mestremoedeiro.com.br  /inicio.html;
    cursos.mundonumista.com.br /curso.html;   # página de lançamento do curso (02/11/2026)
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    location = / {
        if ($host = downloads.mundonumista.com.br) { return 301 https://mestremoedeiro.com.br/; }
        try_files $pagina_inicial =404;
    }
    location / { try_files $uri $uri/ =404; }

    # QR code do verso das bandeiras de moedas (D48, 04/11/2026): mestremoedeiro.com.br/e/<id> está
    # IMPRESSO em papel — nunca remover. A página do emissor mora na versão web; 302 (e não 301) para
    # o destino poder mudar sem que navegadores guardem o redirecionamento antigo.
    location ^~ /e/ { return 302 https://app.mestremoedeiro.com.br$request_uri; }
    # QR do verso das Cédulas do Brasil (D51, 05/11/2026): mestremoedeiro.com.br/c/<bt> — também impresso.
    location ^~ /c/ { return 302 https://app.mestremoedeiro.com.br$request_uri; }

    # Arquivos publicos da Central de Comunicacao.
    location /comunicacao/ {
        alias /data/site/comunicacao/;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Termos de Uso publicados pelo painel administrativo.
    location /termos/ {
        alias /data/site/termos/;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
    }
}
