name: Publicar imagem de downloads

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Validar arquivos essenciais
        run: |
          test ! -e site/index.html   # D52: sem página do programa para Windows
          test -s site/inicio.html
          test -s site/curso.html
          grep -q 'cursos.mundonumista.com.br /curso.html;' nginx.conf
          grep -q 'https://app.mestremoedeiro.com.br' site/inicio.html
          grep -q 'mestremoedeiro.com.br      /inicio.html;' nginx.conf
          test -s nginx.conf
          test -s Dockerfile
          ! grep -q 'alias /data/site/versao.json;' nginx.conf
          ! grep -q 'alias /data/site/arquivos/;' nginx.conf
          grep -q 'return 301 https://mestremoedeiro.com.br/' nginx.conf
          ! grep -q 'downloads.mundonumista.com.br' site/inicio.html site/curso.html
          grep -q 'alias /data/site/comunicacao/;' nginx.conf
          grep -q 'alias /data/site/termos/;' nginx.conf
          ! grep -q 'proxy_pass' nginx.conf
          ! grep -q '/usr/share/nginx/html:ro' stack.yml

      - name: Validar a configuração do Nginx
        run: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      # Em pull requests apenas valida; a imagem so e publicada no main.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/pcfmachado-stack/mestre-moedeiro-downloads:0.2.3-beta
            ghcr.io/pcfmachado-stack/mestre-moedeiro-downloads:sha-${{ github.sha }}
