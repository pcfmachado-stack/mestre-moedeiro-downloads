version: '3.8'
services:
  mm-downloads-web:
    image: ghcr.io/pcfmachado-stack/mestre-moedeiro-downloads:0.2.0-beta
    volumes:
      - mm_downloads_data:/data:ro
    networks:
      - network_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == manager1
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.mm-downloads-new.rule=Host(`downloads.mundonumista.com.br`)
        - traefik.http.routers.mm-downloads-new.entrypoints=websecure
        - traefik.http.routers.mm-downloads-new.tls=true
        - traefik.http.routers.mm-downloads-new.tls.certresolver=letsencryptresolver
        - traefik.http.routers.mm-downloads-new.service=mm-downloads-new
        - traefik.http.services.mm-downloads-new.loadbalancer.server.port=8080
networks:
  network_public:
    external: true
    name: network_public
volumes:
  mm_downloads_data:
    external: true
    name: mestre_moedeiro_distribuicao_mm_downloads_data
