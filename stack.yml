version: '3.8'
services:
  mm-downloads-web:
    image: ghcr.io/pcfmachado-stack/mestre-moedeiro-downloads:0.2.3-beta
    volumes:
      - mm_downloads_data:/data:ro
    networks:
      - network_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.mm-downloads-v2.rule=Host(`downloads.mundonumista.com.br`) || Host(`mestremoedeiro.com.br`) || Host(`www.mestremoedeiro.com.br`)
        - traefik.http.routers.mm-downloads-v2.entrypoints=websecure
        - traefik.http.routers.mm-downloads-v2.tls=true
        - traefik.http.routers.mm-downloads-v2.tls.certresolver=letsencryptresolver
        - traefik.http.routers.mm-downloads-v2.service=mm-downloads-v2
        - traefik.http.services.mm-downloads-v2.loadbalancer.server.port=8080
networks:
  network_public:
    external: true
    name: network_public
volumes:
  mm_downloads_data:
    external: true
    name: mestre_moedeiro_distribuicao_mm_downloads_data
